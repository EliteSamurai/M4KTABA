name: Deploy

on:
  push:
    branches: [main]

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '8'

jobs:
  # Single deploy path: any push to main deploys straight to production.
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Secrets preflight
        id: deploy_preflight
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ] || [ -z "${{ secrets.VERCEL_ORG_ID }}" ] || [ -z "${{ secrets.VERCEL_PROJECT_ID }}" ]; then
            echo "::error::Vercel secrets missing (VERCEL_TOKEN/VERCEL_ORG_ID/VERCEL_PROJECT_ID). Push did NOT deploy. Set them in repo Settings → Secrets and variables → Actions, then re-push."
            exit 1
          fi

      - name: Build application
        run: pnpm build
        env:
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          NODE_ENV: production
          # Sanity env is required at build time on the GitHub runner: with
          # NODE_ENV=production and no VERCEL_ENV, lib/sanity-clients.ts
          # enforces these invariants (missing values throw during static
          # generation). Values come from repo secrets (see .env.local).
          SANITY_PROJECT_ID: ${{ secrets.SANITY_PROJECT_ID }}
          SANITY_DATASET: ${{ secrets.SANITY_DATASET }}
          SANITY_API_VERSION: ${{ secrets.SANITY_API_VERSION }}
          SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}

      - name: Deploy to Vercel (Production)
        uses: amondnet/vercel-action@v42
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: ./

      - name: Run production smoke tests
        run: |
          echo "Running smoke tests against production environment"
          # Add smoke tests here

      - name: Notify deployment
        uses: 8398a7/action-slack@v3
        if: always() && env.SLACK_WEBHOOK_URL != ''
        with:
          status: ${{ job.status }}
          channel: '#deployments'
          webhook_url: ${{ env.SLACK_WEBHOOK_URL }}

  # Rollback stub — currently just logs. TODO (standalone future item):
  # implement real rollback-to-previous-version behavior.
  rollback:
    name: Rollback
    runs-on: ubuntu-latest
    if: failure()
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: Rollback to previous version
        run: |
          echo "Rolling back to previous version..."
          # Add rollback logic here

      - name: Notify rollback
        uses: 8398a7/action-slack@v3
        if: always() && env.SLACK_WEBHOOK_URL != ''
        with:
          status: failure
          channel: '#deployments'
          webhook_url: ${{ env.SLACK_WEBHOOK_URL }}
